# Build the static site and publish it to GitHub Pages on every push to main.
# Same shape as staeiou/docs2rows. Pages must be enabled on the repo with the
# "GitHub Actions" source; the site then lives under the custom domain of the
# user site as stuartgeiger.com/<repo-name>/.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The unit suite includes the Python parity check (the bundle's runtime
      # must build the same request bodies as the browser); it needs the
      # runtime's own requirements plus json_repair for the parser twin.
      - name: Install the bundle runtime's Python requirements
        run: python3 -m pip install --quiet httpx aiometer aiolimiter tenacity tqdm aiosqlite json_repair

      - name: Typecheck, unit tests, build
        run: |
          npm run typecheck
          npm test
          npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
